<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f4ee"><title>문장 사이 · 릴레이 소설</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><a href="/" class="brand"><i aria-hidden="true">〃</i>문장 사이</a><span>릴레이 소설 작업실</span></header><main id="home"><section class="intro"><small>함께 쓰는 소설</small><h1>이야기의 다음은,<br><em>친구의 문장.</em></h1><p>첫 문단을 쓰고 친구를 초대하세요.<br>한 사람씩, 한 문단씩 이야기를 이어갑니다.</p><div class="book"><div class="spine"></div><div class="paper"><small>첫 문단 예시</small><h2>분실물 보관소</h2><blockquote>막차가 떠난 뒤, 분실물 보관소의 전화가 울렸다. 수화기 너머에서 어제의 내가 말했다.</blockquote><span>문장 사이 단편선</span></div></div></section><section class="card"><small>새 원고</small><h2>집필실 열기</h2><form id="create"><label>소설 제목<input name="title" maxlength="80" placeholder="우리 이야기의 제목" required></label><label>내 필명<input name="name" maxlength="20" placeholder="친구들에게 보일 이름" required></label><label>첫 문단<textarea name="text" maxlength="3000" rows="6" placeholder="모든 이야기는 한 문장에서 시작해요." required></textarea></label><button>집필실 만들기</button></form><div id="recent"></div></section></main><main id="room" hidden><small>공동 집필 원고</small><h1 id="title"></h1><div class="roomgrid"><article id="story"></article><aside class="card"><h2>집필실</h2><p id="status"></p><button id="invite" class="secondary">초대 링크 복사</button><input id="link" readonly hidden aria-label="초대 링크"><h3>집필 순서</h3><ol id="people"></ol><form id="join" hidden><label>내 필명<input name="name" maxlength="20" required></label><button>참여하기</button></form><button id="start" hidden>이어쓰기 시작</button><form id="write" hidden><label>다음 문단<textarea name="text" rows="6" maxlength="3000" required></textarea></label><button>문단 등록</button></form></aside></div></main><div id="notice" role="status"></div><footer>문장 사이 <span>릴레이 소설 작업실</span></footer></body></html>
