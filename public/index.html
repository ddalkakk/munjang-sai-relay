<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <title>컴남 릴레이 소설</title>
  <link rel="stylesheet" href="/style.css?v=11">
  <script type="module" src="/app.js?v=11"></script>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="brand" aria-label="컴남 릴레이 소설 홈">
        <span class="wordmark">컴남</span>
        <span class="brandtype">릴레이 소설</span>
      </a>
      <div class="actions">
        <button id="theme" class="icon" aria-label="다크 모드" aria-pressed="false">
          <i aria-hidden="true" class="moon"></i>
        </button>
        <button id="account" class="soft">로그인</button>
      </div>
    </nav>
  </header>

  <main id="home">
    <div class="deskhead">
      <div>
        <h1>나의 집필실</h1>
        <p>친구와 한 문단씩 이어 쓰는 소설.</p>
      </div>
      <button id="new" class="shine"><span aria-hidden="true">＋</span> 새 집필실</button>
    </div>
    <section class="shelf" aria-labelledby="shelfTitle">
      <div class="shelfhead">
        <h2 id="shelfTitle">참여한 원고</h2>
        <span id="shelfCount" class="shelfcount" hidden></span>
      </div>
      <div class="manuscript">
        <div class="jacket" aria-hidden="true"><canvas id="landscape"></canvas></div>
        <div id="recent"></div>
      </div>
      <div id="history" class="history" hidden>
        <h3 class="history-title">이전 원고 기록</h3>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </section>
  </main>

  <main id="room" hidden>
    <section id="lockGate" class="panel lock-gate" hidden>
      <span class="lock-badge">비공개 원고</span>
      <h1>비밀번호를 입력해 주세요</h1>
      <p>초대 링크와 함께 공유받은 원고 비밀번호를 입력해야 내용을 볼 수 있어요.</p>
      <form id="lockForm">
        <label>원고 비밀번호
          <span class="pw">
            <input name="password" type="password" maxlength="64" required placeholder="비밀번호를 입력하세요">
            <button type="button" class="showpw" id="showLockPw">보기</button>
          </span>
        </label>
        <p id="lockError" class="inline-error" role="alert"></p>
        <button class="shine">원고 열기</button>
      </form>
    </section>

    <div id="roomHead" class="roomhead">
      <span class="eyebrow">공동 원고</span>
      <h1 id="title">원고 불러오는 중</h1>
      <div class="roomhead-actions">
        <button id="roomPassBtn" class="soft" hidden>비밀번호 설정</button>
        <button id="invite" class="soft">초대 링크 복사</button>
      </div>
      <input id="link" readonly hidden aria-label="초대 링크">
    </div>
    <div id="roomGrid" class="grid">
      <article class="panel" id="story"></article>
      <aside class="panel">
        <h2>참여 작가</h2>
        <p id="status" aria-live="polite"></p>
        <ol id="people"></ol>
        <button id="join" hidden></button>
        <button id="start" class="shine" hidden>이어쓰기 시작</button>
        <button id="claim" class="claim-btn shine" hidden>내가 이어쓰기</button>
        <form id="write" hidden>
          <label>다음 문단
            <textarea name="text" maxlength="3000" rows="6" required placeholder="이야기를 자연스럽게 이어 써 보세요"></textarea>
          </label>
          <small id="writeCount" class="counter">0 / 3,000자</small>
          <div class="write-actions">
            <button type="button" id="release" class="soft">차례 양보</button>
            <button class="shine">문단 등록</button>
          </div>
        </form>
      </aside>
    </div>
  </main>

  <dialog id="modal" aria-labelledby="heading">
    <div class="dialoghead">
      <h2 id="heading"></h2>
      <button id="close" class="icon" aria-label="닫기">×</button>
    </div>
    <div id="auth">
      <div class="segments">
        <button id="login" type="button" aria-pressed="true">로그인</button>
        <button id="register" type="button" aria-pressed="false">계정 만들기</button>
      </div>
      <form id="credentials">
        <label>이름<input name="name" autocomplete="username" maxlength="20" required></label>
        <label>비밀번호
          <span class="pw">
            <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
            <button type="button" class="showpw" id="showpw">보기</button>
          </span>
        </label>
        <small id="hint"></small>
        <button id="submitAuth" class="shine">로그인</button>
      </form>
    </div>
    <form id="create" hidden>
      <label>소설 제목<input name="title" maxlength="80" required placeholder="제목을 입력하세요"></label>
      <label>첫 문단<textarea name="text" maxlength="3000" rows="6" required placeholder="이야기의 첫 장면을 들려주세요"></textarea></label>
      <small id="createCount" class="counter">0 / 3,000자</small>
      <label>원고 비밀번호
        <span class="pw">
          <input name="password" type="password" maxlength="64" required placeholder="초대받은 친구가 입력할 비밀번호">
          <button type="button" class="showpw" id="showCreatePw">보기</button>
        </span>
      </label>
      <small>비밀번호가 없으면 초대 링크로 들어와도 원고를 볼 수 없어요.</small>
      <button class="shine">집필실 만들기</button>
    </form>
    <form id="roomPass" hidden>
      <label>새 원고 비밀번호
        <span class="pw">
          <input name="password" type="password" maxlength="64" required placeholder="비밀번호를 입력하세요">
          <button type="button" class="showpw" id="showRoomPassPw">보기</button>
        </span>
      </label>
      <small>비밀번호를 변경하면 초대받은 친구에게 새 비밀번호를 알려 주세요.</small>
      <div class="pass-actions">
        <button type="button" id="removeRoomPass" class="danger-btn" hidden>잠금 해제</button>
        <button class="shine">비밀번호 저장</button>
      </div>
    </form>
    <div id="profile" hidden>
      <p id="who"></p>
      <button id="logout" class="soft">로그아웃</button>
    </div>
    <p id="error" role="alert"></p>
  </dialog>

  <div id="notice" role="status"></div>
</body>
</html>
