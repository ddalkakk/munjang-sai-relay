<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>컴남 릴레이 소설</title><link rel="stylesheet" href="/style.css?v=2"><script type="module" src="/app.js?v=2"></script></head>
<body><header><nav><a href="/" class="brand"><i class="mark" aria-hidden="true"></i>컴남 릴레이 소설</a><div class="actions"><button id="theme" class="icon" aria-label="다크 모드" aria-pressed="false">◐</button><button id="account" class="soft">로그인</button></div></nav></header>
<main id="home"><section class="hero"><div><span class="eyebrow">릴레이 집필실</span><h1>함께 쓰는<br>한 편의 소설<span>.</span></h1><p>첫 문단을 쓰고 친구를 초대하세요.<br>다음 작가가 그 자리에서 이야기를 이어갑니다.</p><button id="new">새 집필실 열기</button></div><div class="art" role="img" aria-label="보랏빛 표지의 릴레이 소설 원고"><div class="shadow"></div><div class="cover"><div class="coverlabel">컴남 릴레이 소설</div><div class="waves"></div><strong>릴레이<br>원고집</strong></div></div></section>
<section class="shelf"><div class="sectionhead"><h2>최근 집필실</h2></div><div id="recent" class="panel"></div></section></main>
<main id="room" hidden><div class="roomhead"><span class="eyebrow">공동 원고</span><h1 id="title">원고 불러오는 중</h1><button id="invite" class="soft">초대 링크 복사</button><input id="link" readonly hidden aria-label="초대 링크"></div><div class="grid"><article class="panel" id="story"></article><aside class="panel"><h2>집필 순서</h2><p id="status" aria-live="polite"></p><ol id="people"></ol><button id="join" hidden></button><button id="start" hidden>이어쓰기 시작</button><form id="write" hidden><label>다음 문단<textarea name="text" maxlength="3000" rows="6" required></textarea></label><button>문단 등록</button></form></aside></div></main>
<dialog id="modal" aria-labelledby="heading"><div class="dialoghead"><h2 id="heading"></h2><button id="close" class="icon" aria-label="닫기">×</button></div><div id="auth"><div class="segments"><button id="login" aria-pressed="true">로그인</button><button id="register" aria-pressed="false">계정 만들기</button></div><form id="credentials"><label>이름<input name="name" autocomplete="username" maxlength="20" required></label><label>비밀번호<span class="pw"><input name="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" class="showpw" id="showpw">보기</button></span></label><small id="hint"></small><button id="submitAuth">로그인</button></form></div>
<form id="create" hidden><label>소설 제목<input name="title" maxlength="80" required placeholder="제목을 입력하세요"></label><label>첫 문단<textarea name="text" maxlength="3000" rows="6" required placeholder="이야기의 첫 장면을 들려주세요"></textarea></label><button>집필실 만들기</button></form><div id="profile" hidden><p id="who"></p><button id="logout" class="soft">로그아웃</button></div><p id="error" role="alert"></p></dialog><div id="notice" role="status"></div></body></html>
